<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bu site iptal edilmiştir</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{display:flex;align-items:center;justify-content:center;min-height:100dvh;padding:24px;
    font-family:'Baloo 2',system-ui,sans-serif;color:#3a1530;text-align:center;
    background:linear-gradient(160deg,#e9e4e6,#cfc7cb)}
  .box{max-width:420px;background:#fff;border-radius:24px;padding:30px 24px;box-shadow:0 14px 34px rgba(58,21,48,.18)}
  .e{font-size:72px;line-height:1;margin-bottom:10px;filter:grayscale(.6)}
  .stamp{display:inline-block;border:4px solid #c62f45;color:#c62f45;font-weight:800;font-size:26px;letter-spacing:3px;
    padding:2px 16px;border-radius:10px;transform:rotate(-6deg);margin-bottom:16px}
  h1{font-size:23px;line-height:1.25;margin:0 0 10px;font-weight:800}
  p{margin:0;opacity:.6;font-size:15px}
</style>
</head>
<body>
  <div class="box">
    <div class="e">💔</div>
    <div class="stamp">İPTAL</div>
    <h1>Bu site gerekli ilgi ve alaka sağlanmadığı için iptal edilmiştir.</h1>
    <p>Anlayışınız için teşekkür ederiz.</p>
  </div>
</body>
</html>
