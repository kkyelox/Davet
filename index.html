<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sana bir sorum var 💌</title>
<meta name="theme-color" content="#ffd0de">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{ --pink:#ff4f8b; --ink:#3a1530; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;overflow:hidden;font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink)}
  body{display:flex;flex-direction:column;height:100dvh;
    background:radial-gradient(120% 80% at 20% 0%,#ffe6ef 0%,#ffd0de 45%,#ffc2b0 100%);
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  .bgh{position:fixed;font-size:20px;opacity:.22;animation:float linear infinite;pointer-events:none;z-index:0}
  @keyframes float{from{transform:translateY(110vh) rotate(0)}to{transform:translateY(-15vh) rotate(360deg)}}

  #stage{position:relative;flex:1;min-height:0;z-index:1;overflow:hidden}
  @media (hover:hover) and (pointer:fine){ #stage, #stage *{cursor:none!important} }
  .scr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:34px 14px 8px;text-align:center}
  .inner{display:flex;flex-direction:column;align-items:center;width:100%;max-width:460px;transform-origin:center center;
         animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
  @keyframes pop{from{opacity:0;transform:scale(.9) translateY(10px)}}
  h1{font-size:clamp(25px,7vw,40px);line-height:1.08;margin:0 0 6px;font-weight:800}
  h2{font-size:clamp(20px,5.6vw,28px);line-height:1.1;margin:0 0 8px;font-weight:800}
  .sub{font-size:15px;opacity:.75;margin:0 0 12px;min-height:22px;font-weight:500;line-height:1.3}
  .big-emoji{font-size:70px;line-height:1;margin-bottom:4px;animation:bob 2s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-4deg)}}

  .btn{border:0;border-radius:999px;font-family:inherit;font-weight:800;color:#fff;text-decoration:none;display:inline-block;
       background:linear-gradient(135deg,var(--pink),#ff7a59);padding:10px 26px;font-size:19px;
       box-shadow:0 5px 0 #c8346a,0 10px 24px rgba(200,52,106,.3);transition:transform .15s,filter .15s}
  .btn.hov{filter:brightness(1.1);transform:translateY(-2px) scale(1.05)}
  .btn.off{filter:grayscale(.7) opacity(.55)}
  .btn.ghost{background:#fff;color:var(--pink);box-shadow:0 4px 0 #f3b3c8}
  .btn.sm{font-size:15px;padding:7px 16px}

  #yes{font-size:clamp(44px,13vw,68px);padding:8px 44px;transition:transform .35s cubic-bezier(.2,1.6,.4,1),filter .15s;animation:glow 1.6s ease-in-out infinite}
  @keyframes glow{50%{box-shadow:0 5px 0 #c8346a,0 10px 40px rgba(255,79,139,.75)}}
  .runaway,.decoy{position:absolute;border:2px solid #d9a2b4;background:#fff;color:#8a5a6c;border-radius:999px;
       font-family:inherit;font-weight:700;font-size:15px;padding:5px 14px;white-space:nowrap;z-index:5;
       transition:left .38s cubic-bezier(.3,1.5,.5,1),top .38s cubic-bezier(.3,1.5,.5,1),font-size .3s;transform:rotate(var(--rot,0deg))}
  .runaway.wig{animation:wig .4s}
  .decoy{transition:transform .2s;animation:popin .4s cubic-bezier(.2,1.6,.4,1)}
  .decoy.hov{transform:scale(1.08)}
  @keyframes popin{from{transform:scale(0)}}
  @keyframes wig{25%{transform:rotate(-12deg) scale(1.1)}75%{transform:rotate(10deg) scale(.95)}}

  .grid{display:grid;gap:8px;width:100%}
  .g3{grid-template-columns:repeat(3,1fr)} .g4{grid-template-columns:repeat(4,1fr)}
  .card{background:#fff;border:3px solid transparent;border-radius:16px;padding:7px 4px;font-family:inherit;
        font-weight:700;font-size:13px;line-height:1.15;color:var(--ink);box-shadow:0 4px 0 #f1b7c9;transition:transform .15s}
  .card .e{font-size:26px;display:block;line-height:1.25}
  .card.hov{transform:translateY(-2px) scale(1.04)}
  .card.sel{border-color:#c8346a;background:var(--pink);color:#fff;transform:scale(1.05);box-shadow:0 4px 0 #c8346a}
  .chip b{display:block;font-size:18px}
  .lbl{font-weight:800;margin:8px 0 5px;font-size:15px;opacity:.8}
  .row{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}

  /* HUD */
  #hud{position:fixed;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:30;background:#fff;border-radius:999px;
       padding:2px 12px;font-weight:800;font-size:15px;box-shadow:0 3px 0 #f1b7c9;transition:transform .2s}
  #hud.bump{transform:scale(1.25)}
  #badges{position:fixed;top:calc(8px + env(safe-area-inset-top));left:10px;z-index:30;font-size:18px;letter-spacing:2px}
  .steps{position:absolute;top:12px;left:0;right:0;display:flex;justify-content:center;gap:5px}
  .steps i{width:7px;height:7px;border-radius:50%;background:rgba(58,21,48,.2)}
  .steps i.on{background:var(--pink);width:20px;border-radius:5px}
  .plus{position:fixed;z-index:45;font-weight:800;color:var(--pink);pointer-events:none;animation:up .9s ease-out forwards;font-size:18px}
  @keyframes up{to{transform:translateY(-50px);opacity:0}}

  /* wheel */
  .wheelBox{position:relative;width:230px;height:230px;margin:6px 0}
  .wheel{position:absolute;inset:0;border-radius:50%;border:6px solid #fff;box-shadow:0 8px 24px rgba(160,40,80,.3);
    background:conic-gradient(#ff8fb3 0 60deg,#ffd166 60deg 120deg,#7bdff2 120deg 180deg,#b892ff 180deg 240deg,#ff7a59 240deg 300deg,#9be38f 300deg 360deg);
    transition:transform 3.6s cubic-bezier(.12,.8,.2,1)}
  .wheel span{position:absolute;left:50%;top:50%;font-size:30px;width:40px;height:40px;margin:-20px 0 0 -20px;line-height:40px}
  .wheelBox .ptr{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:30px;z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
  .wheelBox .hub{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px;border-radius:50%;background:#fff;
    display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:0 2px 6px rgba(0,0,0,.2)}

  /* hearts game */
  .heart{position:absolute;font-size:38px;z-index:4;pointer-events:none;will-change:transform;left:0;top:0}
  .heart.got{animation:got .4s forwards}
  @keyframes got{to{opacity:0;font-size:80px}}
  .meter{width:220px;height:14px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
  .meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fb3,var(--pink));transition:width .3s}

  /* ticket + scratch */
  .tWrap{position:relative;width:100%;max-width:330px}
  .ticket{background:#fff;border-radius:20px;width:100%;padding:14px 16px;text-align:left;box-shadow:0 12px 30px rgba(160,40,80,.25)}
  .ticket .top{font-weight:800;color:var(--pink);font-size:12px;letter-spacing:2px}
  .ticket .ttl{font-size:22px;font-weight:800;margin:0 0 6px}
  .ticket .ln{display:flex;gap:8px;font-size:16px;margin:2px 0}
  .ticket .cut{border-top:2px dashed #f2bfd0;margin:8px -16px 6px}
  .ticket .bar{height:26px;background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 5px,var(--ink) 5px 6px,transparent 6px 9px);opacity:.8;border-radius:3px}
  .ticket .small{font-size:12px;opacity:.65;margin-top:4px}
  #scratch{position:absolute;inset:0;width:100%;height:100%;border-radius:20px;touch-action:none;transition:opacity .6s}
  .hidden{visibility:hidden}
  #shot{max-width:100%;border-radius:14px;box-shadow:0 8px 20px rgba(0,0,0,.2)}

  /* pad */
  #padWrap{position:relative;z-index:2;padding:6px 12px calc(8px + env(safe-area-inset-bottom))}
  #pad{height:clamp(105px,20dvh,165px);border-radius:20px;touch-action:none;position:relative;overflow:hidden;
       background:radial-gradient(circle,rgba(255,255,255,.18) 1.2px,transparent 1.5px) 0 0/18px 18px,linear-gradient(160deg,#4a1d3f,#2c0f26);
       box-shadow:inset 0 2px 8px rgba(0,0,0,.4),0 5px 14px rgba(58,21,48,.3);
       display:flex;align-items:center;justify-content:center;color:#ffd6e4}
  #pad .hint{font-size:16px;font-weight:700;opacity:.9;text-align:center;pointer-events:none;transition:opacity .3s;line-height:1.2}
  #pad .hint small{display:block;font-size:12px;opacity:.7;font-weight:500}
  #pad.pulse{animation:padpulse 1.4s ease-in-out infinite}
  @keyframes padpulse{50%{box-shadow:inset 0 2px 8px rgba(0,0,0,.4),0 0 0 5px rgba(255,79,139,.45)}}
  #pad .finger{position:absolute;left:0;top:0;width:44px;height:44px;border-radius:50%;background:rgba(255,143,179,.35);
       border:2px solid rgba(255,214,228,.6);will-change:transform;pointer-events:none;opacity:0;transition:opacity .2s}
  #lclick{display:block;width:100%;height:34px;margin-top:6px;border-radius:12px;border:0;font-family:inherit;font-weight:800;font-size:15px;
       background:#3b1533;color:#ffd6e4;box-shadow:0 3px 0 #1d0819;touch-action:manipulation}
  #lclick:active{transform:translateY(2px);box-shadow:0 1px 0 #1d0819}

  #cursor{position:fixed;left:0;top:0;width:28px;height:28px;z-index:50;pointer-events:none;
          filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));will-change:transform}
  .ripple{position:fixed;width:16px;height:16px;border-radius:50%;border:3px solid var(--pink);z-index:49;
          pointer-events:none;transform:translate(-50%,-50%);animation:rip .5s ease-out forwards}
  @keyframes rip{to{width:60px;height:60px;opacity:0}}
  #toast{position:fixed;left:50%;top:calc(40px + env(safe-area-inset-top));transform:translate(-50%,-220%);z-index:60;
         background:var(--ink);color:#fff;padding:7px 16px;border-radius:999px;font-weight:700;font-size:15px;
         transition:transform .35s cubic-bezier(.2,1.5,.4,1);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
  #toast.show{transform:translate(-50%,0)}
  #toast.badge{background:linear-gradient(135deg,#ffb703,#ff7a59)}
  #confetti{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
</style>
</head>
<body>
<div id="stage"></div>
<div id="padWrap">
  <div id="pad" class="pulse">
    <div class="hint" id="hint">👆 Fareyi buradan sürükle<small>Dokun = tıkla</small></div>
    <div class="finger" id="finger"></div>
  </div>
  <button id="lclick">Tıkla</button>
</div>
<div id="hud">💖 0</div>
<div id="badges"></div>
<svg id="cursor" viewBox="0 0 30 30"><path d="M3 2 L3 24 L9 18.5 L13 27 L17 25.2 L13 16.8 L21 16.8 Z" fill="#fff" stroke="#3a1530" stroke-width="2" stroke-linejoin="round"/></svg>
<div id="toast"></div>
<canvas id="confetti"></canvas>

<script>
const NAME = "Murat";

const stage=document.getElementById('stage'), pad=document.getElementById('pad'), cursorEl=document.getElementById('cursor');
const finger=document.getElementById('finger'), hint=document.getElementById('hint');
const state={act:null,actEmoji:'',dayLabel:'',day:null,time:null,pay:null,noTries:0,score:0,badges:[],heartTime:0};
let cx=0,cy=0,runaways=[],hovered=null,onMove=null,screenId=0;

/* background hearts */
['💖','💕','💗','✨','💘','🌸'].forEach(h=>{for(let k=0;k<2;k++){const s=document.createElement('div');s.className='bgh';s.textContent=h;
  s.style.left=(Math.random()*95)+'vw';s.style.animationDuration=(12+Math.random()*14)+'s';s.style.animationDelay=(-Math.random()*20)+'s';document.body.appendChild(s);}});

/* ---------- helpers ---------- */
function toast(t,ms=1700,cls=''){const el=document.getElementById('toast');el.className=cls;el.textContent=t;void el.offsetWidth;el.classList.add('show');
  clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),ms);}
function addScore(n,x,y){
  state.score+=n;const h=document.getElementById('hud');h.textContent='💖 '+state.score;h.classList.remove('bump');void h.offsetWidth;h.classList.add('bump');
  setTimeout(()=>h.classList.remove('bump'),200);
  const p=document.createElement('div');p.className='plus';p.textContent='+'+n;p.style.left=((x??cx)+10)+'px';p.style.top=((y??cy)-10)+'px';
  document.body.appendChild(p);setTimeout(()=>p.remove(),900);
}
const BADGES={israr:["🏅","Israrcı"],avci:["🎯","Hayır Avcısı"],kandi:["😜","Kandırıldın"],kader:["🎡","Kadere Güvenen"],kalp:["💘","Kalp Hırsızı"],sans:["🍀","Şanslı Bilet"],cesur:["🦁","Cesur"]};
function badge(k){ if(state.badges.includes(k))return; state.badges.push(k); const b=BADGES[k];
  setTimeout(()=>toast(`${b[0]} Rozet kazandın: ${b[1]}!`,2200,'badge'),300);
  document.getElementById('badges').textContent=state.badges.map(x=>BADGES[x][0]).join(''); addScore(25);}

let _sr=null;function stageRect(){return _sr||(_sr=stage.getBoundingClientRect());}
addEventListener('resize',()=>{_sr=null;padRect=null;fit();});
function setCursor(x,y){
  const r=stageRect();
  cx=Math.max(r.left+2,Math.min(r.right-6,x)); cy=Math.max(r.top+2,Math.min(r.bottom-6,y));
  cursorEl.style.transform=`translate3d(${cx}px,${cy}px,0)`;
  checkRunaways(); onMove&&onMove(cx,cy);
  if(!setCursor._q){setCursor._q=true;requestAnimationFrame(()=>{setCursor._q=false;updateHover();});}
}
function targetAt(x,y){const el=document.elementFromPoint(x,y);return el?el.closest('.clk'):null;}
function updateHover(){const t=targetAt(cx,cy);if(t!==hovered){hovered&&hovered.classList.remove('hov');hovered=t;t&&t.classList.add('hov');}}
function ripple(x,y){const d=document.createElement('div');d.className='ripple';d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),550);}
function vclick(){ripple(cx+3,cy+3);const t=targetAt(cx+2,cy+2);if(!t)return;const r=runaways.find(o=>o.el===t);if(r){flee(r);return;}t.click();}

/* ---------- runaway buttons ---------- */
function addRunaway(el,msgs,onFlee){
  const o={el,msgs,n:0,onFlee,x:0,y:0,w:0,h:0};runaways.push(o);
  el.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();flee(o);});
  el.addEventListener('click',e=>{e.preventDefault();flee(o);});return o;
}
function placeRunaway(o,x,y){o.x=x;o.y=y;o.el.style.left=x+'px';o.el.style.top=y+'px';}
function checkRunaways(){const sr=stageRect();for(const o of runaways){const w=o.w||(o.w=o.el.offsetWidth),h=o.h||(o.h=o.el.offsetHeight);
  const px=cx-sr.left,py=cy-sr.top,m=44;if(px>o.x-m&&px<o.x+w+m&&py>o.y-m&&py<o.y+h+m)flee(o);}}
function freeSpot(w,h,minD){
  const sr=stageRect(),W=sr.width,H=sr.height,p=10,px=cx-sr.left,py=cy-sr.top;
  const avoid=[...stage.querySelectorAll('.avoid')].map(e=>{const r=e.getBoundingClientRect();return{l:r.left-sr.left-8,t:r.top-sr.top-8,r:r.right-sr.left+8,b:r.bottom-sr.top+8};});
  let best={x:p,y:40},bd=-1;
  for(let i=0;i<60;i++){const x=p+Math.random()*Math.max(1,W-w-2*p),y=36+Math.random()*Math.max(1,H-h-46);
    if(avoid.some(a=>x<a.r&&x+w>a.l&&y<a.b&&y+h>a.t))continue;const d=Math.hypot(x+w/2-px,y+h/2-py);
    if(d>bd){bd=d;best={x,y};}if(d>minD&&Math.random()<.5)break;}
  return best;
}
function flee(o){
  const now=performance.now();if(o._last&&now-o._last<120)return;o._last=now;
  o.n++;state.noTries++;o.el.textContent=o.msgs[Math.min(o.n,o.msgs.length-1)];o.w=0;o.h=0;
  const s=freeSpot(o.el.offsetWidth,o.el.offsetHeight,190);placeRunaway(o,s.x,s.y);
  o.el.style.setProperty('--rot',(Math.random()*24-12)+'deg');o.el.classList.remove('wig');void o.el.offsetWidth;o.el.classList.add('wig');
  if(navigator.vibrate)try{navigator.vibrate(25)}catch(e){}
  o.onFlee&&o.onFlee(o);
}

/* ---------- screens ---------- */
function steps(i){return `<div class="steps">${[0,1,2,3,4,5].map(k=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>`;}
function fit(){const inn=stage.querySelector('.inner');if(!inn)return;inn.style.transform='none';
  const avail=stage.clientHeight-44,h=inn.scrollHeight,s=Math.min(1,avail/h);inn.style.transform=s<1?`scale(${s})`:'';}
function show(html,after){
  runaways=[];hovered=null;onMove=null;screenId++;
  stage.innerHTML=`<div class="scr">${html.steps||''}<div class="inner">${html.body}</div></div>`;
  fit();requestAnimationFrame(()=>{fit();after&&after(stage.firstElementChild);updateHover();});
}
const $=s=>stage.querySelector(s), $$=s=>[...stage.querySelectorAll(s)];

function scrIntro(){
  show({body:`
    <div class="big-emoji">💌</div>
    <h1>Sana küçük bir<br>sorum var…</h1>
    <p class="sub">Aşağıdaki pad'den imleci sürükle,<br>zarfın üstüne getir ve dokun 👇<br><b>Her adımda kalp puanı topla 💖</b></p>
    <button class="btn clk" id="open">Zarfı aç ✉️</button>`},
  ()=>{$('#open').onclick=()=>{pad.classList.remove('pulse');addScore(10);scrQuestion();};});
}

const noMsgs=["Hayır","Emin misin? 🤨","Son kararın mı?","Bir daha düşün 🥺","Kalbimi kırıyorsun 💔","Yanlış butona gidiyorsun",
  "Bu buton bozuk galiba 🔧","Evet daha güzel duruyor 👉","Hadi ama 😭","Pes etmiyorsun ha 😤","Yakalayamazsın 🏃‍♀️","Ben kaçarım 💨",
  "Sonsuza kadar kaçarım","Evet'e bas artık 🙏","😶"];
const subMsgs=["Dikkatli seç…","Hmm, ilginç bir seçim 🤔","O buton biraz utangaç","Bak Evet ne kadar büyüdü 👀","Hayır butonu tatile çıktı 🏖️",
  "Bu oyunu kazanamazsın 😌","Evet seni bekliyor 💖","Tek yol var, biliyorsun 😇"];
function scrQuestion(){
  show({steps:steps(0),body:`
    <h1>Benimle bir etkinlik<br>yapmak ister misin? 🥰</h1>
    <p class="sub" id="qsub">Dikkatli seç…</p>
    <button class="btn clk avoid" id="yes">EVET</button>
    <div style="height:60px"></div>`},
  scr=>{
    const yes=$('#yes');yes.onclick=()=>{addScore(50);scrYay(false);};
    const no=document.createElement('button');no.className='runaway clk';no.textContent='Hayır';scr.appendChild(no);
    let decoyMade=false;
    const o=addRunaway(no,noMsgs,o=>{
      yes.style.transform=`scale(${Math.min(1+o.n*0.06,1.5)})`;
      $('#qsub').textContent=subMsgs[Math.min(Math.floor(o.n/2),subMsgs.length-1)];
      if(o.n===3)badge('israr'); if(o.n===10)badge('avci'); if(o.n>=14)no.style.fontSize='11px';
      if(o.n===6&&!decoyMade){decoyMade=true;makeDecoy(scr);}
    });
    const sr=stageRect(),yr=yes.getBoundingClientRect();
    placeRunaway(o,(yr.left+yr.width/2-sr.left)-no.offsetWidth/2,yr.bottom-sr.top+20);
  });
}
function makeDecoy(scr){
  const d=document.createElement('button');d.className='decoy clk';d.textContent='Hayır';scr.appendChild(d);
  const s=freeSpot(d.offsetWidth,d.offsetHeight,120);d.style.left=s.x+'px';d.style.top=s.y+'px';
  toast("Aa, bir Hayır daha çıktı! 👀");
  d.onclick=()=>{d.textContent='Şaka 😜 Bu da EVET!';d.style.background='#ff4f8b';d.style.color='#fff';badge('kandi');
    setTimeout(()=>scrYay(true),1000);};
}
function scrYay(tricked){
  confetti();const t=state.noTries;
  show({body:`
    <div class="big-emoji">🥳</div>
    <h1>YAAAY!<br>Biliyordum 😌💖</h1>
    <p class="sub">${tricked?"Sahte Hayır'a kandın 😂 ":""}${t?`Hayır'ı ${t} kez yakalamaya çalıştın ama olmadı 😂`:"Hiç tereddüt etmedin, bayıldım 😍"}<br>Şimdi detayları ayarlayalım!</p>
    <button class="btn clk" id="go">Hadi! →</button>`},
  ()=>{if(!t&&!tricked)badge('cesur');$('#go').onclick=scrActivity;});
}

const acts=[["🎬","Sinema"],["🍝","Akşam yemeği"],["☕","Kahve & tatlı"],["🎳","Bowling"],["🌅","Sahil yürüyüşü"],["🎮","Oyun gecesi"]];
const actLines=["Patlamış mısır benden 🍿","Acıktım bile 😋","Tatlı seçimi sende 🍰","Kaybeden dondurma ısmarlar 🍦","Gün batımı ayarlandı 🌇","Seni yenerim 😏"];
function scrActivity(){
  show({steps:steps(1),body:`
    <h2>Ne yapalım? 🤔</h2>
    <div class="grid g3">${acts.map((a,i)=>`<button class="card clk" data-i="${i}"><span class="e">${a[0]}</span>${a[1]}</button>`).join('')}</div>
    <div class="row"><button class="btn ghost sm clk" id="wheelBtn">🎡 Kararsızım, çark çevir</button></div>
    <div class="row"><button class="btn clk off" id="next">Devam →</button></div>`},
  ()=>{
    $$('.card').forEach(c=>c.onclick=()=>{$$('.card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
      const i=+c.dataset.i;state.act=acts[i][1];state.actEmoji=acts[i][0];$('#next').classList.remove('off');toast(actLines[i]);});
    $('#wheelBtn').onclick=scrWheel;
    $('#next').onclick=()=>{if(!state.act){toast("Önce bir şey seç 👀");return;}addScore(20);scrHearts();};
  });
}
function scrWheel(){
  show({steps:steps(1),body:`
    <h2>Kader çarkı 🎡</h2><p class="sub" id="ws">Ne çıkarsa o!</p>
    <div class="wheelBox"><div class="ptr">🔻</div><div class="wheel" id="wheel">
      ${acts.map((a,i)=>`<span style="transform:rotate(${i*60+30}deg) translateY(-78px) rotate(${-(i*60+30)}deg)">${a[0]}</span>`).join('')}
    </div><div class="hub">💖</div></div>
    <div class="row"><button class="btn clk" id="spin">Çevir!</button></div>`},
  ()=>{
    let rot=0,spinning=false;
    $('#spin').onclick=()=>{
      if(spinning)return;
      if(state.act&&$('#spin').dataset.done){addScore(20);scrHearts();return;}
      spinning=true;rot+=1440+Math.floor(Math.random()*360);$('#wheel').style.transform=`rotate(${rot}deg)`;$('#ws').textContent='Dönüyor… 🌀';
      setTimeout(()=>{spinning=false;const ang=(360-rot%360)%360,i=Math.floor(ang/60)%6;
        state.act=acts[i][1];state.actEmoji=acts[i][0];$('#ws').innerHTML=`Kader dedi ki: <b>${acts[i][0]} ${acts[i][1]}</b>`;
        badge('kader');confetti(60);$('#spin').textContent='Tamam bu olsun →';$('#spin').dataset.done=1;
        if(!$('#again')){const b=document.createElement('button');b.className='btn ghost sm clk';b.id='again';b.textContent='Bir daha çevir 🔄';
          b.onclick=()=>{$('#spin').dataset.done='';$('#spin').textContent='Çevir!';$('#spin').click();};$('#spin').parentNode.appendChild(b);fit();}
      },3700);
    };
  });
}

function scrHearts(){
  show({steps:steps(2),body:`
    <h2>Takvimin kilidi açılsın 🔐</h2>
    <p class="sub">İmleci kalplerin üstüne götürüp<br><b>5 kalbi yakala!</b> Altın kalp ekstra puan ⭐</p>
    <div class="meter"><i id="mt"></i></div><p class="sub" id="hc" style="margin-top:6px">0 / 5 · 0.0 sn</p>`},
  scr=>{
    const id=screenId,sr=stageRect(),hearts=[];let caught=0;const t0=performance.now();
    for(let i=0;i<6;i++){const el=document.createElement('div');el.className='heart';const gold=i===5;el.textContent=gold?'💛':'💖';scr.appendChild(el);
      const sp=gold?3.2:1.6;hearts.push({el,gold,x:20+Math.random()*(sr.width-60),y:60+Math.random()*(sr.height-110),
        vx:(Math.random()<.5?-1:1)*sp*(0.6+Math.random()*.6),vy:(Math.random()<.5?-1:1)*sp*(0.6+Math.random()*.6),alive:true});}
    const check=()=>{const r=stageRect();for(const h of hearts){if(!h.alive)continue;
      if(Math.hypot(cx-(r.left+h.x+19),cy-(r.top+h.y+22))<34){h.alive=false;h.el.classList.add('got');
        addScore(h.gold?40:15,r.left+h.x,r.top+h.y);if(navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
        if(h.gold)toast("Altın kalp! ⭐");else{caught++;$('#mt').style.width=(caught*20)+'%';}
        if(caught>=5)done();}}};
    const done=()=>{if(state.heartTime)return;state.heartTime=(performance.now()-t0)/1000;if(state.heartTime<10)badge('kalp');
      confetti(80);toast(`Kilit açıldı! ${state.heartTime.toFixed(1)} sn 🔓`);setTimeout(()=>{if(id===screenId)scrDate();},1300);};
    onMove=check;state.heartTime=0;
    const loop=()=>{if(id!==screenId)return;const r=stageRect();
      for(const h of hearts){if(!h.alive)continue;h.x+=h.vx;h.y+=h.vy;
        if(h.x<4||h.x>r.width-44)h.vx*=-1;if(h.y<30||h.y>r.height-48)h.vy*=-1;
        h.el.style.transform=`translate3d(${h.x}px,${h.y}px,0)`;}
      check();if(!state.heartTime)$('#hc').textContent=`${caught} / 5 · ${((performance.now()-t0)/1000).toFixed(1)} sn`;
      requestAnimationFrame(loop);};
    loop();
  });
}

function scrDate(){
  const days=[],now=new Date();for(let i=0;i<8;i++){const d=new Date(now);d.setDate(now.getDate()+i);days.push(d);}
  const times=["12:00","14:00","16:00","18:00","19:30","21:00"];
  show({steps:steps(3),body:`
    <h2>Ne zaman? 📅</h2>
    <div class="grid g4" id="days">${days.map((d,i)=>`<button class="card chip clk" data-i="${i}"><b>${d.getDate()}</b>${i===0?"Bugün":i===1?"Yarın":d.toLocaleDateString('tr-TR',{weekday:'short'})}</button>`).join('')}</div>
    <div class="lbl">Saat kaçta? ⏰</div>
    <div class="grid g3" id="times">${times.map(t=>`<button class="card chip clk" data-t="${t}"><b>${t}</b></button>`).join('')}</div>
    <div class="row"><button class="btn clk off" id="next">Devam →</button></div>`},
  ()=>{
    const upd=()=>{if(state.day!==null&&state.time)$('#next').classList.remove('off');};
    $$('#days .card').forEach(c=>c.onclick=()=>{$$('#days .card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
      const i=+c.dataset.i;state.day=i;state.dayLabel=days[i].toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'});
      toast(i===0?"Bugün mü?! Hazırlanıyorum 🏃‍♂️":i===1?"Yarın! Heyecanlandım 🤩":i>5?"Bu kadar bekleyemem ama tamam 😅":"Takvime yazıldı ✍️");upd();});
    $$('#times .card').forEach(c=>c.onclick=()=>{$$('#times .card').forEach(x=>x.classList.remove('sel'));c.classList.add('sel');
      state.time=c.dataset.t;toast(state.time==="21:00"?"Gece kuşu 🦉":state.time==="12:00"?"Öğle randevusu ☀️":"Mükemmel saat 👌");upd();});
    $('#next').onclick=()=>{if(state.day===null||!state.time){toast("Gün ve saati seç 👀");return;}addScore(20);scrPay();};
  });
}

    <div class="big-emoji">💸</div>
    <h2>Son soru:<br>Hesabı kim öder?</h2>

  scr=>{

    $('#p2').onclick=()=>{state.pay=NAME+" öder, tatlı senden";addScore(30);scrTicket();};
    const p3=document.createElement('button');p3.className='runaway clk';p3.textContent='Ben öderim';scr.appendChild(p3);

/* ---------- ticket (scratch card) ---------- */
function scrTicket(){
  show({steps:steps(5),body:`
    <h2 id="th">Kazı ve randevunu gör! 🍀</h2>
    <div class="tWrap" id="tw">
      <div class="ticket">
        <div class="top">✦ RANDEVU BİLETİ ✦</div>
        <div class="ttl">Onaylandı! 💖</div>
        <div class="ln">${state.actEmoji} <span>${state.act}</span></div>
        <div class="ln">📅 <span>${state.dayLabel}</span></div>
        <div class="ln">⏰ <span>${state.time}</span></div>
        <div class="ln">💸 <span>${state.pay}</span></div>
        <div class="cut"></div><div class="bar"></div>
        <div class="small">Kaçan Hayır: ${state.noTries} · Puan: <span id="tsc">${state.score}</span> 💖</div>
      </div>
      <canvas id="scratch"></canvas>
    </div>
    <div class="row hidden" id="acts">
      <button class="btn clk" id="share">📸 Bileti resim olarak gönder</button>
    </div>
    <div class="row hidden" id="acts2"><button class="btn ghost sm clk" id="again">Baştan oyna ↺</button></div>
    <p class="sub" id="sent" style="margin:8px 0 0;font-weight:700"></p>`},
  ()=>{
    const id=screenId,cv=$('#scratch'),tw=$('#tw'),W=tw.offsetWidth,H=tw.offsetHeight,dpr=Math.min(2,devicePixelRatio||1);
    cv.width=W*dpr;cv.height=H*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
    const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#ff8fb3');gr.addColorStop(1,'#ff7a59');g.fillStyle=gr;
    rr(g,0,0,W,H,20);g.fill();g.font='22px serif';
    for(let i=0;i<18;i++)g.fillText(['💖','✨','💕'][i%3],Math.random()*W,Math.random()*H);
    g.fillStyle='#fff';g.font="800 24px 'Baloo 2', sans-serif";g.textAlign='center';g.fillText('✨ Burayı kazı ✨',W/2,H/2);
    g.font="600 14px 'Baloo 2', sans-serif";g.fillText('imleci üstünde gezdir',W/2,H/2+22);
    g.globalCompositeOperation='destination-out';
    let cnt=0,revealed=false;
    const scratch=(x,y)=>{if(revealed)return;const r=cv.getBoundingClientRect();if(x<r.left||x>r.right||y<r.top||y>r.bottom)return;
      const sx=(x-r.left)*W/r.width,sy=(y-r.top)*H/r.height;g.beginPath();g.arc(sx,sy,26,0,7);g.fill();
      if(++cnt%10===0&&cleared()>0.5)reveal();};
    const cleared=()=>{const d=g.getImageData(0,0,cv.width,cv.height).data;let c=0,t=0;for(let i=3;i<d.length;i+=64){t++;if(d[i]===0)c++;}return c/t;};
    const reveal=()=>{if(revealed||id!==screenId)return;revealed=true;cv.style.opacity=0;setTimeout(()=>cv.remove(),600);
      badge('sans');confetti();$('#th').textContent='Randevun hazır! 🎉';
      setTimeout(()=>{$('#tsc')&&($('#tsc').textContent=state.score);},400);
      $('#acts').classList.remove('hidden');$('#acts2').classList.remove('hidden');fit();
      setTimeout(async()=>{let r=await sendTicketEmail(false);if(!r.ok){await new Promise(z=>setTimeout(z,2500));r=await sendTicketEmail(false);}
        const n=$('#sent');if(n)n.textContent=r.ok?`💌 Bilet ${NAME}'a da gitti!`:'';},700);};
    onMove=scratch;
    cv.addEventListener('pointermove',e=>setCursor(e.clientX,e.clientY));
    cv.addEventListener('pointerdown',e=>setCursor(e.clientX,e.clientY));
    $('#share').onclick=shareImage;
    $('#again').onclick=()=>{Object.assign(state,{act:null,day:null,time:null,pay:null,noTries:0,score:0,badges:[],heartTime:0});
      document.getElementById('hud').textContent='💖 0';document.getElementById('badges').textContent='';scrIntro();};
  });
}
function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}

/* ---------- ticket image ---------- */
async function makeTicketImage(){
  try{await document.fonts.ready;}catch(e){}
  const W=1080,H=1350,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
  const F=(w,s)=>`${w} ${s}px 'Baloo 2', sans-serif`;
  let gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#ffe6ef');gr.addColorStop(.5,'#ffd0de');gr.addColorStop(1,'#ffc2b0');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.globalAlpha=.25;g.font='60px serif';for(let i=0;i<26;i++)g.fillText(['💖','💕','✨','💘','🌸'][i%5],Math.random()*W,Math.random()*H);g.globalAlpha=1;
  g.textAlign='center';g.fillStyle='#3a1530';g.font=F(800,78);g.fillText('Randevumuz var! 🥰',W/2,170);
  const x=110,y=240,w=W-220,h=880;
  g.save();g.shadowColor='rgba(160,40,80,.3)';g.shadowBlur=50;g.shadowOffsetY=20;g.fillStyle='#fff';rr(g,x,y,w,h,50);g.fill();g.restore();
  g.textAlign='left';g.fillStyle='#ff4f8b';g.font=F(800,36);g.fillText('✦  R A N D E V U   B İ L E T İ  ✦',x+60,y+90);
  g.fillStyle='#3a1530';g.font=F(800,76);g.fillText('Onaylandı! 💖',x+60,y+185);
  const lines=[[state.actEmoji,state.act],['📅',state.dayLabel],['⏰',state.time],['💸',state.pay]];
  g.font=F(700,52);lines.forEach((l,i)=>{g.fillText(l[0]+'  '+l[1],x+60,y+290+i*84);});
  g.strokeStyle='#f2bfd0';g.lineWidth=5;g.setLineDash([18,14]);g.beginPath();g.moveTo(x,y+650);g.lineTo(x+w,y+650);g.stroke();g.setLineDash([]);
  g.fillStyle='#ffd0de';g.beginPath();g.arc(x,y+650,30,0,7);g.arc(x+w,y+650,30,0,7);g.fill();
  g.fillStyle='#3a1530';let bx=x+60;while(bx<x+w-60){const bw=[4,8,4,12,6][Math.floor(Math.random()*5)];g.fillRect(bx,y+690,bw,90);bx+=bw+[6,10,8][Math.floor(Math.random()*3)];}
  g.font=F(600,34);g.globalAlpha=.7;g.fillText(`Kaçan Hayır: ${state.noTries}  ·  Puan: ${state.score} 💖`,x+60,y+835);g.globalAlpha=1;
  g.textAlign='center';g.font=F(700,44);g.fillStyle='#3a1530';
  const bs=state.badges.map(k=>BADGES[k][0]).join(' ');
  if(bs)g.fillText('Rozetler: '+bs,W/2,y+h+95);
  g.font=F(600,32);g.globalAlpha=.6;g.fillText('İade ve iptal yoktur 😌',W/2,y+h+160);g.globalAlpha=1;
  return c;
}
async function shareImage(){
  const c=await makeTicketImage();
  const blob=await new Promise(r=>c.toBlob(r,'image/png'));
  const file=new File([blob],'randevu-bileti.png',{type:'image/png'});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Randevu bileti 💖'});toast('Gönderildi gibi 💌');return;}
  }catch(e){if(e&&e.name==='AbortError')return;}
  // fallback: show image to long-press save
  const url=c.toDataURL('image/png');
  show({body:`<h2>Bilet resmin hazır 📸</h2><p class="sub">Resme basılı tut → kaydet,<br>sonra WhatsApp'tan ${NAME}'a gönder 💌</p>
    <img id="shot" src="${url}" alt="Randevu bileti" style="user-select:auto;-webkit-user-select:auto;-webkit-touch-callout:default;max-height:55vh">
    <div class="row"><a class="btn sm clk" href="${url}" download="randevu-bileti.png">⬇️ İndir</a></div>`});
}


/* ---------- e-posta bildirimi (FormSubmit) ---------- */
const MAIL_TO="kkyelox@gmail.com";
async function sendTicketEmail(test){
  try{
    const c=await makeTicketImage();
    const blob=await new Promise(r=>c.toBlob(r,'image/jpeg',0.88));
    const fields={_subject:test?'🧪 Deneme bileti (Davet sitesi)':'💖 Yeni randevu bileti geldi!',_template:'table',_captcha:'false',
      'Etkinlik':(state.actEmoji||'')+' '+(state.act||'-'),'Gün':state.dayLabel||'-','Saat':state.time||'-','Hesap':state.pay||'-',
      'Puan':String(state.score),'Kaçan Hayır':String(state.noTries),
      'Rozetler':state.badges.map(k=>BADGES[k].join(' ')).join(', ')||'-',
      'Kalp oyunu süresi':state.heartTime?state.heartTime.toFixed(1)+' sn':'-'};
    // Klasik multipart form + gizli iframe: FormSubmit ekleri bu yolla iletiyor
    const name='mf'+Date.now();
    const ifr=document.createElement('iframe');ifr.name=name;ifr.style.display='none';document.body.appendChild(ifr);
    const f=document.createElement('form');f.method='POST';f.action='https://formsubmit.co/'+MAIL_TO;f.enctype='multipart/form-data';
    f.target=name;f.style.display='none';
    for(const [k,v] of Object.entries(fields)){const i=document.createElement('input');i.type='hidden';i.name=k;i.value=v;f.appendChild(i);}
    const fi=document.createElement('input');fi.type='file';fi.name='attachment';
    const dt=new DataTransfer();dt.items.add(new File([blob],'randevu-bileti.jpg',{type:'image/jpeg'}));fi.files=dt.files;f.appendChild(fi);
    document.body.appendChild(f);
    const done=new Promise(r=>{ifr.addEventListener('load',()=>r(true),{once:true});setTimeout(()=>r(false),15000);});
    f.submit();
    const ok=await done;setTimeout(()=>{f.remove();ifr.remove();},2000);
    return {ok,msg:ok?'gönderildi':'zaman aşımı'};
  }catch(e){return {ok:false,msg:String(e)};}
}
if(location.hash==='#mailtest'){
  Object.assign(state,{act:'Deneme etkinliği',actEmoji:'🧪',dayLabel:'Deneme günü',time:'00:00',pay:NAME+' öder',score:123,noTries:7,badges:['israr','kader']});
  setTimeout(async()=>{const r=await sendTicketEmail(true);document.title='MAILTEST '+(r.ok?'OK':'FAIL')+' '+r.msg;
    const d=document.createElement('div');d.id='mailres';d.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#fff;padding:8px;font-size:14px';
    d.textContent='MAILTEST '+(r.ok?'OK':'FAIL')+': '+r.msg;document.body.appendChild(d);},1500);
}

/* ---------- touchpad ---------- */
let pid=null,lx=0,ly=0,st=0,moved=0,padRect=null;
function fingerAt(e){padRect=padRect||pad.getBoundingClientRect();finger.style.transform=`translate3d(${e.clientX-padRect.left-22}px,${e.clientY-padRect.top-22}px,0)`;}
pad.addEventListener('pointerdown',e=>{e.preventDefault();pad.setPointerCapture(e.pointerId);pid=e.pointerId;lx=e.clientX;ly=e.clientY;st=performance.now();moved=0;
  padRect=pad.getBoundingClientRect();fingerAt(e);finger.style.opacity=1;hint.style.opacity=.2;});
pad.addEventListener('pointermove',e=>{
  if(e.pointerId!==pid)return;
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  let nx=cx,ny=cy;
  for(const ev of evs){const dx=ev.clientX-lx,dy=ev.clientY-ly;lx=ev.clientX;ly=ev.clientY;moved+=Math.abs(dx)+Math.abs(dy);
    const k=1.8+Math.min(Math.hypot(dx,dy)/10,1.4);nx+=dx*k;ny+=dy*k;
    if(onMove){setCursor(nx,ny);nx=cx;ny=cy;}}
  setCursor(nx,ny);fingerAt(e);
});
function endPad(e){if(e.pointerId!==pid)return;pid=null;finger.style.opacity=0;hint.style.opacity=.9;if(moved<10&&performance.now()-st<300)vclick();}
pad.addEventListener('pointerup',endPad);
pad.addEventListener('pointercancel',e=>{if(e.pointerId===pid){pid=null;finger.style.opacity=0;hint.style.opacity=.9;}});
document.getElementById('lclick').addEventListener('click',vclick);
stage.addEventListener('pointermove',e=>{if(e.pointerType==='mouse')setCursor(e.clientX,e.clientY);});
document.addEventListener('touchmove',e=>{if(!e.target.closest('#pad')&&!e.target.closest('#scratch'))e.preventDefault();},{passive:false});

/* ---------- confetti ---------- */
const cv=document.getElementById('confetti'),cg=cv.getContext('2d');let parts=[],raf=null;
function resize(){cv.width=innerWidth*devicePixelRatio;cv.height=innerHeight*devicePixelRatio;}resize();addEventListener('resize',resize);
function confetti(n=160){const cols=['#ff4f8b','#ff8fb3','#ffd166','#7bdff2','#b892ff','#ff7a59'];
  for(let i=0;i<n;i++)parts.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,s:4+Math.random()*6,c:cols[i%6],r:Math.random()*6,vr:(Math.random()-.5)*.3,h:Math.random()<.2,life:0});
  if(!raf)tick();}
function tick(){const d=devicePixelRatio;cg.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{p.vy+=.35;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life++;cg.save();cg.translate(p.x*d,p.y*d);cg.rotate(p.r);
    if(p.h){cg.font=(p.s*3*d)+'px serif';cg.fillText('💖',0,0);}else{cg.fillStyle=p.c;cg.fillRect(-p.s*d/2,-p.s*d/4,p.s*d,p.s*d/2);}cg.restore();});
  parts=parts.filter(p=>p.y<innerHeight+40&&p.life<300);raf=parts.length?requestAnimationFrame(tick):(cg.clearRect(0,0,cv.width,cv.height),null);}

/* start */
requestAnimationFrame(()=>{const r=stageRect();setCursor(r.left+r.width/2,r.top+r.height*0.8);});
scrIntro();
</script>
